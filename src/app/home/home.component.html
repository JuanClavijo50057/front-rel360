<!-- src/app/home/home.component.html (ACTUALIZADO) -->
<div class="home-shell">

  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <div class="logo">NL</div>
      <div class="brand-text">
        <span class="brand-name">NutriLabel</span>
        <span class="brand-sub">Etiquetas Nutricionales</span>
      </div>
    </div>
    <div class="header-right">
      <span class="user-email">{{ auth.currentUser()?.email }}</span>
      <button class="logout-btn" (click)="logout()">Salir</button>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="tab-nav">
    <button class="tab-btn" [class.active]="activeTab() === 'upload'" (click)="setTab('upload')">
      <span class="tab-icon"></span>
      <span class="tab-label">Subir PDF</span>
    </button>
    <button class="tab-btn" [class.active]="activeTab() === 'history'" (click)="setTab('history')">
      <span class="tab-icon"></span>
      <span class="tab-label">Historial</span>
    </button>
    <button class="tab-btn" [class.active]="activeTab() === 'manual'" (click)="setTab('manual')">
      <span class="tab-icon"></span>
      <span class="tab-label">Ingreso Manual</span>
    </button>
    <button class="tab-btn" [class.active]="activeTab() === 'packaging'" (click)="setTab('packaging')">
      <span class="tab-icon"></span>
      <span class="tab-label">Empaques</span>
    </button>
  </nav>

  <!-- Contenido -->
  <main class="tab-content">

    <div *ngIf="activeTab() === 'upload'">
      <app-upload (documentProcessed)="onDocumentProcessed($event)"></app-upload>
    </div>

    <div *ngIf="activeTab() === 'history'">
      <app-history (documentSelected)="onDocumentSelected($event)"></app-history>

      <!-- Panel de vista previa al seleccionar del historial -->
      <div class="preview-panel" *ngIf="selectedDoc()">
        <div class="preview-header">
          <h3>{{ selectedDoc()?.producto || selectedDoc()?.fileName }}</h3>
          <button class="btn-ghost-sm" (click)="selectedDoc.set(null)">✕</button>
        </div>
        <app-nutrition-label
          *ngIf="selectedDoc()?.nutritionData"
          [data]="selectedDoc()!.nutritionData">
        </app-nutrition-label>
      </div>
    </div>

    <div *ngIf="activeTab() === 'manual'">
      <app-manual-entry (documentProcessed)="onDocumentProcessed($event)"></app-manual-entry>
    </div>

    <div *ngIf="activeTab() === 'packaging'">
      <app-packaging></app-packaging>
    </div>

  </main>

</div>
